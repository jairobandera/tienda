<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar | Tienda Kairos</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css?v=2">
  <link rel="stylesheet" href="/theme.css">
  <script type="module" src="/js/pages/auth.js"></script>
</head>
<body>
  <main class="auth-wrap">
    <div class="card card-pad">
      <h1>Ingresá con tu email</h1>
      <p class="alert alert-info hidden" id="need-login">Para comprar tenés que iniciar sesión.</p>
      <div class="alert alert-error hidden" id="error" role="alert"></div>
      <form id="login-form" data-mode="login" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary btn-block" type="submit">Ingresar</button>
      </form>
      <p class="switch">¿No tenés cuenta? <a href="/registro" id="to-register">Creá tu cuenta</a></p>
    </div>
  </main>
</body>
</html>
